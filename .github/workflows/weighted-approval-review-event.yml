name: weighted-approval-review-event
run-name: weighted-approval-review-event:${{ github.event.pull_request.number }}

# nexuslbs fork policy (thread 2857): this workflow MUST NOT run automatically.
# All automatic triggers inherited from upstream (push / pull_request / schedule /
# issues / ...) were removed - the only automatic workflow in this repository is
# publish.yml (tag `vX.Y.Z` -> :X.Y.Z, push to `stable` -> :latest).
# Run this workflow by hand from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch:

permissions: {}

jobs:
  record-review-event:
    if: github.event.pull_request.state == 'open'
    name: record weighted approval review event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record review event
        run: echo 'Recorded a weighted approval review event.'
