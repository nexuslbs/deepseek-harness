name: Expected filenames

# nexuslbs fork policy (thread 2857): this workflow MUST NOT run automatically.
# All automatic triggers inherited from upstream (push / pull_request / schedule /
# issues / ...) were removed - the only automatic workflow in this repository is
# publish.yml (tag `vX.Y.Z` -> :X.Y.Z, push to `stable` -> :latest).
# Run this workflow by hand from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  expected-filenames:
    name: no golden filenames
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith' && 'blacksmith-4vcpu-ubuntu-2404'
          || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tracked filenames
        run: scripts/check-expected-filenames.sh
